<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Cyber Tag Arena</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      box-shadow: 0 0 50px rgba(14, 165, 233, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    .hud-subtext {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div id="game-container"></div>
<div class="hud-subtext">Cyber Tag • WASD / Arrows to Move • Space / Shift to Dash • Contact to Tag</div>

<script>
// --- COSMETICS CATALOG ---
const COSMETICS = {
  TITLES: [
    { id: 'NONE', label: 'NO TITLE', cost: 0 },
    { id: 'ROOKIE', label: '⚡ ROOKIE', cost: 150 },
    { id: 'SHADOW', label: '🥷 SHADOW STEPPER', cost: 400 },
    { id: 'TAG_GOD', label: '👑 TAG OVERLORD', cost: 1000 },
    { id: 'UNTOUCHABLE', label: '👻 UNTOUCHABLE', cost: 2500 }
  ],
  TRAILS: [
    { id: 'DEFAULT', label: 'Cyan Pulse', color: 0x06b6d4, cost: 0 },
    { id: 'NEON_GREEN', label: 'Toxic Lime', color: 0x10b981, cost: 300 },
    { id: 'FLAME', label: 'Solar Flare', color: 0xf97316, cost: 600 },
    { id: 'VOID', label: 'Void Purple', color: 0xa855f7, cost: 1200 }
  ]
};

// --- ACCOUNT & PROFILE MANAGER ---
class AccountManager {
  constructor() {
    this.activeUser = localStorage.getItem('tag_cyber_active_user') || 'CyberRunner';
    this.loadProfile();
  }

  loadProfile() {
    const raw = localStorage.getItem(`tag_cyber_account_${this.activeUser}`);
    if (raw) {
      this.data = JSON.parse(raw);
    } else {
      this.data = {
        username: this.activeUser,
        coins: 200,
        xp: 0,
        level: 1,
        wins: 0,
        matches: 0,
        equippedTitle: 'NONE',
        equippedTrail: 'DEFAULT',
        unlockedTitles: ['NONE'],
        unlockedTrails: ['DEFAULT']
      };
      this.saveProfile();
    }
  }

  saveProfile() {
    localStorage.setItem(`tag_cyber_account_${this.activeUser}`, JSON.stringify(this.data));
    localStorage.setItem('tag_cyber_active_user', this.activeUser);
  }

  switchUser(newUsername) {
    if (!newUsername) return;
    this.activeUser = newUsername.trim();
    this.loadProfile();
  }

  addRewards(won, coinsEarned, xpEarned) {
    this.data.coins += coinsEarned;
    this.data.xp += xpEarned;
    this.data.matches += 1;
    if (won) this.data.wins += 1;

    const nextLevelXp = this.data.level * 200;
    if (this.data.xp >= nextLevelXp) {
      this.data.level += 1;
    }

    this.saveProfile();
  }
}

const account = new AccountManager();

// --- KEYBINDS SYSTEM ---
const DEFAULT_KEYBINDS = {
  up: 'KeyW',
  left: 'KeyA',
  down: 'KeyS',
  right: 'KeyD',
  dash: 'Space',
  tag: 'ShiftLeft'
};

function getSavedKeybinds() {
  const saved = localStorage.getItem('tag_cyber_keybinds');
  return saved ? JSON.parse(saved) : { ...DEFAULT_KEYBINDS };
}

function saveKeybinds(binds) {
  localStorage.setItem('tag_cyber_keybinds', JSON.stringify(binds));
}

let userKeybinds = getSavedKeybinds();

// --- CHARACTER CLASSES ---
const CHARACTERS = {
  STRIKER: { name: 'Striker', speed: 230, dashForce: 650, tagRadius: 45, color: 0x38bdf8 },
  PHANTOM: { name: 'Phantom', speed: 260, dashForce: 800, tagRadius: 40, color: 0xa855f7 },
  TITAN: { name: 'Titan', speed: 190, dashForce: 500, tagRadius: 70, color: 0xf59e0b }
};

// --- PEERJS NETWORK MANAGER ---
class NetworkManager {
  constructor() {
    this.peer = null;
    this.conn = null;
    this.isHost = false;
    this.roomCode = '';
  }

  initHost(onOpen, onClientConnect, onData) {
    this.isHost = true;
    this.roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
    this.peer = new Peer(`cyber-tag-${this.roomCode}`);

    this.peer.on('open', () => onOpen(this.roomCode));
    this.peer.on('connection', (conn) => {
      this.conn = conn;
      this.setupConnection(onData);
      onClientConnect();
    });
  }

  initJoin(code, onSuccess, onError, onData) {
    this.isHost = false;
    this.roomCode = code.toUpperCase();
    this.peer = new Peer();

    this.peer.on('open', () => {
      this.conn = this.peer.connect(`cyber-tag-${this.roomCode}`);
      this.setupConnection(onData);
      this.conn.on('open', () => onSuccess());
    });

    this.peer.on('error', (err) => onError(err));
  }

  setupConnection(onData) {
    this.conn.on('data', (data) => onData(data));
  }

  send(data) {
    if (this.conn && this.conn.open) {
      this.conn.send(data);
    }
  }
}

const net = new NetworkManager();

// --- PLAYER CLASS ---
class Player extends Phaser.GameObjects.Container {
  constructor(scene, x, y, classKey, isIt = false, profileData = null) {
    super(scene, x, y);
    this.scene = scene;
    this.isIt = isIt;
    this.profile = profileData || account.data;
    this.stats = { ...CHARACTERS[classKey] };

    this.isDashing = false;
    this.canDash = true;
    this.canTag = true;

    // Tag Range Aura
    this.rangeCircle = scene.add.graphics();
    this.add(this.rangeCircle);

    // Player Avatar Circle
    this.bodyCircle = scene.add.circle(0, 0, 16, this.isIt ? 0xef4444 : this.stats.color);
    this.add(this.bodyCircle);

    // Inner Glow Core
    this.coreCircle = scene.add.circle(0, 0, 6, 0xffffff, 0.9);
    this.add(this.coreCircle);

    // Username & Cosmetic Title
    const titleObj = COSMETICS.TITLES.find(t => t.id === this.profile.equippedTitle);
    const titleText = (titleObj && titleObj.id !== 'NONE') ? `${titleObj.label}\n` : '';

    this.nameTag = scene.add.text(0, -38, `${titleText}${this.profile.username}`, {
      fontFamily: 'Orbitron',
      fontSize: '10px',
      fontStyle: 'bold',
      fill: '#f8fafc',
      align: 'center'
    }).setOrigin(0.5);
    this.add(this.nameTag);

    // Status Badge
    this.roleBadge = scene.add.text(0, -22, isIt ? 'IT' : 'RUNNER', {
      fontFamily: 'Orbitron',
      fontSize: '10px',
      fontStyle: 'bold',
      fill: isIt ? '#ef4444' : '#38bdf8'
    }).setOrigin(0.5);
    this.add(this.roleBadge);

    // Physics Initialization
    scene.physics.world.enable(this);
    this.body.setCollideWorldBounds(true);
    this.body.setCircle(16, -16, -16);
    scene.add.existing(this);
  }

  dash(vector) {
    if (!this.canDash || this.isDashing) return;

    this.isDashing = true;
    this.canDash = false;

    this.body.setVelocity(vector.x * this.stats.dashForce, vector.y * this.stats.dashForce);

    const trailObj = COSMETICS.TRAILS.find(t => t.id === this.profile.equippedTrail) || COSMETICS.TRAILS[0];
    const ghostTimer = this.scene.time.addEvent({
      delay: 30,
      repeat: 5,
      callback: () => {
        const ghost = this.scene.add.circle(this.x, this.y, 14, trailObj.color, 0.7);
        this.scene.tweens.add({
          targets: ghost,
          alpha: 0,
          scale: 0.2,
          duration: 300,
          onComplete: () => ghost.destroy()
        });
      }
    });

    this.scene.time.delayedCall(180, () => {
      this.isDashing = false;
    });

    this.scene.time.delayedCall(1200, () => {
      this.canDash = true;
    });
  }

  attemptTag(target) {
    if (!this.isIt || !this.canTag) return false;

    const dist = Phaser.Math.Distance.Between(this.x, this.y, target.x, target.y);
    if (dist <= this.stats.tagRadius) {
      this.canTag = false;
      this.setItState(false);
      target.setItState(true);

      this.scene.time.delayedCall(1000, () => { this.canTag = true; });
      return true;
    }
    return false;
  }

  setItState(isIt) {
    this.isIt = isIt;
    this.bodyCircle.setFillStyle(isIt ? 0xef4444 : this.stats.color);
    this.roleBadge.setText(isIt ? 'IT' : 'RUNNER');
    this.roleBadge.setFill(isIt ? '#ef4444' : '#38bdf8');
  }

  renderAura() {
    this.rangeCircle.clear();
    if (this.isIt) {
      this.rangeCircle.lineStyle(2, 0xef4444, 0.8);
      this.rangeCircle.strokeCircle(0, 0, this.stats.tagRadius);
    }
  }
}

// --- SMART BOT AI CONTROLLER ---
class SmartBot extends Player {
  constructor(scene, x, y, classKey, isIt = false, level = 'MEDIUM', obstacles) {
    super(scene, x, y, classKey, isIt, { username: `Bot [${level}]`, equippedTitle: 'NONE', equippedTrail: 'DEFAULT' });
    this.level = level;
    this.obstacles = obstacles;

    this.lastX = x;
    this.lastY = y;
    this.stuckCounter = 0;

    this.setAIStats();
  }

  setAIStats() {
    switch (this.level) {
      case 'EASY':
        this.reactionDelay = 0.6;
        this.dashAggression = 0.02;
        break;
      case 'MEDIUM':
        this.reactionDelay = 0.85;
        this.dashAggression = 0.08;
        break;
      case 'HARD':
        this.reactionDelay = 0.98;
        this.dashAggression = 0.18;
        break;
      case 'IMPOSSIBLE':
        this.reactionDelay = 1.0;
        this.dashAggression = 0.35;
        break;
    }
  }

  updateAI(targetPlayer) {
    const dist = Phaser.Math.Distance.Between(this.x, this.y, targetPlayer.x, targetPlayer.y);

    // Un-stuck corner detector
    if (Math.abs(this.x - this.lastX) < 1 && Math.abs(this.y - this.lastY) < 1) {
      this.stuckCounter++;
    } else {
      this.stuckCounter = 0;
    }

    this.lastX = this.x;
    this.lastY = this.y;

    let moveDir;

    if (this.stuckCounter > 15) {
      // Force escape vector when stuck in corners
      const escapeX = this.x < 400 ? 1 : -1;
      const escapeY = this.y < 300 ? 1 : -1;
      moveDir = new Phaser.Math.Vector2(escapeX, escapeY).normalize();
      if (this.canDash) this.dash(moveDir);
    } else {
      let targetX = targetPlayer.x;
      let targetY = targetPlayer.y;

      if (!this.isIt) {
        targetX = this.x - (targetPlayer.x - this.x);
        targetY = this.y - (targetPlayer.y - this.y);
      }

      let desireDir = new Phaser.Math.Vector2(targetX - this.x, targetY - this.y).normalize();
      moveDir = this.calculateObstacleAvoidance(desireDir);
    }

    if (!this.isDashing) {
      this.body.setVelocity(moveDir.x * this.stats.speed, moveDir.y * this.stats.speed);
    }

    // Smart Dash
    if (this.canDash && Math.random() < this.dashAggression) {
      if (this.isIt && dist < 240 && dist > 50) {
        this.dash(moveDir);
      } else if (!this.isIt && dist < 150) {
        this.dash(moveDir);
      }
    }

    this.renderAura();
  }

  calculateObstacleAvoidance(desiredVector) {
    const rayAngles = [0, 45, -45, 90, -90, 135, -135, 180];
    let bestVector = desiredVector.clone();
    let maxScore = -999;

    rayAngles.forEach(angleDeg => {
      const rad = Phaser.Math.DegToRad(angleDeg);
      const testVec = desiredVector.clone().rotate(rad);
      const rayEnd = new Phaser.Math.Vector2(this.x + testVec.x * 50, this.y + testVec.y * 50);

      let blocked = false;
      this.obstacles.getChildren().forEach(wall => {
        const bounds = wall.getBounds();
        if (Phaser.Geom.Intersects.LineToRectangle(new Phaser.Geom.Line(this.x, this.y, rayEnd.x, rayEnd.y), bounds)) {
          blocked = true;
        }
      });

      if (!blocked) {
        const alignmentScore = testVec.dot(desiredVector);
        if (alignmentScore > maxScore) {
          maxScore = alignmentScore;
          bestVector = testVec;
        }
      }
    });

    return bestVector;
  }
}

// --- MAIN MENU & SHOP SCENE ---
class MenuScene extends Phaser.Scene {
  constructor() {
    super('MenuScene');
  }

  create() {
    this.selectedClass = 'STRIKER';
    this.botLevel = 'MEDIUM';

    this.add.rectangle(400, 300, 800, 600, 0x020617);
    this.add.grid(400, 300, 800, 600, 40, 40, 0x0f172a, 0.4, 0x1e293b, 0.6);

    this.add.text(400, 45, 'CYBER TAG ONLINE', {
      fontFamily: 'Orbitron',
      fontSize: '32px',
      fontStyle: '900',
      fill: '#38bdf8'
    }).setOrigin(0.5);

    this.renderProfileCard();
    this.renderLobbyPanel();
    this.renderClassSelector();
    this.renderShopPanel();
    this.renderKeybindsPanel();
  }

  renderProfileCard() {
    const card = this.add.graphics();
    card.fillStyle(0x0f172a, 0.8);
    card.lineStyle(1, 0x334155, 0.8);
    card.fillRoundedRect(30, 95, 740, 50, 12);
    card.strokeRoundedRect(30, 95, 740, 50, 12);

    const titleObj = COSMETICS.TITLES.find(t => t.id === account.data.equippedTitle);
    const titleStr = (titleObj && titleObj.id !== 'NONE') ? ` | Title: ${titleObj.label}` : '';

    this.profileText = this.add.text(50, 110, `USER: ${account.data.username}   LVL ${account.data.level}   COINS: 🪙${account.data.coins}${titleStr}`, {
      fontFamily: 'Orbitron',
      fontSize: '12px',
      fill: '#facc15'
    });

    const switchBtn = this.add.text(750, 120, '[ SWITCH ]', {
      fontFamily: 'Orbitron',
      fontSize: '11px',
      fill: '#38bdf8'
    }).setOrigin(1, 0.5).setInteractive();

    switchBtn.on('pointerdown', () => {
      const name = prompt('Enter new Username:');
      if (name) {
        account.switchUser(name);
        this.scene.restart();
      }
    });
  }

  renderLobbyPanel() {
    const hostBtn = this.add.text(120, 180, 'HOST LOBBY', {
      fontFamily: 'Orbitron',
      fontSize: '13px',
      fill: '#ffffff',
      backgroundColor: '#2563eb',
      padding: { x: 16, y: 10 }
    }).setOrigin(0.5).setInteractive();

    hostBtn.on('pointerdown', () => {
      net.initHost(
        (code) => alert(`Lobby Created! Share Room Code: ${code}`),
        () => this.scene.start('GameScene', { p1Class: this.selectedClass, isVSBot: false }),
        () => {}
      );
    });

    const joinBtn = this.add.text(280, 180, 'JOIN LOBBY', {
      fontFamily: 'Orbitron',
      fontSize: '13px',
      fill: '#ffffff',
      backgroundColor: '#059669',
      padding: { x: 16, y: 10 }
    }).setOrigin(0.5).setInteractive();

    joinBtn.on('pointerdown', () => {
      const code = prompt('Enter 6-Character Room Code:');
      if (code) {
        net.initJoin(code, () => this.scene.start('GameScene', { p1Class: this.selectedClass, isVSBot: false }), () => alert('Room not found!'));
      }
    });

    const botBtn = this.add.text(520, 180, `VS BOT: ${this.botLevel}`, {
      fontFamily: 'Orbitron',
      fontSize: '13px',
      fill: '#ffffff',
      backgroundColor: '#d97706',
      padding: { x: 16, y: 10 }
    }).setOrigin(0.5).setInteractive();

    botBtn.on('pointerdown', () => {
      const levels = ['EASY', 'MEDIUM', 'HARD', 'IMPOSSIBLE'];
      let idx = (levels.indexOf(this.botLevel) + 1) % levels.length;
      this.botLevel = levels[idx];
      botBtn.setText(`VS BOT: ${this.botLevel}`);
    });

    const startBotBtn = this.add.text(680, 180, 'PLAY VS AI', {
      fontFamily: 'Orbitron',
      fontSize: '13px',
      fill: '#ffffff',
      backgroundColor: '#7c3aed',
      padding: { x: 16, y: 10 }
    }).setOrigin(0.5).setInteractive();

    startBotBtn.on('pointerdown', () => {
      this.scene.start('GameScene', { p1Class: this.selectedClass, isVSBot: true, botLevel: this.botLevel });
    });
  }

  renderClassSelector() {
    this.add.text(50, 230, 'SELECT ARCHETYPE', { fontFamily: 'Orbitron', fontSize: '13px', fill: '#94a3b8' });

    let x = 80;
    Object.keys(CHARACTERS).forEach(key => {
      const cls = CHARACTERS[key];
      const isSelected = this.selectedClass === key;

      const card = this.add.text(x, 260, `${cls.name}\nSpd: ${cls.speed}\nReach: ${cls.tagRadius}`, {
        fontFamily: 'Inter',
        fontSize: '11px',
        fill: isSelected ? '#38bdf8' : '#64748b',
        backgroundColor: isSelected ? '#1e293b' : '#0f172a',
        padding: { x: 12, y: 8 },
        align: 'center'
      }).setInteractive();

      card.on('pointerdown', () => {
        this.selectedClass = key;
        this.scene.restart();
      });

      x += 110;
    });
  }

  renderShopPanel() {
    this.add.text(400, 230, 'COSMETIC VAULT', { fontFamily: 'Orbitron', fontSize: '13px', fill: '#f43f5e' });

    let y = 260;
    COSMETICS.TITLES.slice(0, 4).forEach(item => {
      const unlocked = account.data.unlockedTitles.includes(item.id);
      const equipped = account.data.equippedTitle === item.id;
      const label = `${item.label} ${equipped ? '✓' : unlocked ? '[EQUIP]' : `(🪙${item.cost})`}`;

      const btn = this.add.text(400, y, label, {
        fontFamily: 'Inter',
        fontSize: '11px',
        fill: equipped ? '#4ade80' : unlocked ? '#38bdf8' : '#94a3b8'
      }).setInteractive();

      btn.on('pointerdown', () => {
        if (!unlocked && account.data.coins >= item.cost) {
          account.data.coins -= item.cost;
          account.data.unlockedTitles.push(item.id);
          account.data.equippedTitle = item.id;
          account.saveProfile();
          this.scene.restart();
        } else if (unlocked) {
          account.data.equippedTitle = item.id;
          account.saveProfile();
          this.scene.restart();
        }
      });

      y += 24;
    });
  }

  renderKeybindsPanel() {
    this.add.text(620, 230, 'BINDINGS', { fontFamily: 'Orbitron', fontSize: '13px', fill: '#38bdf8' });

    let y = 260;
    ['up', 'left', 'down', 'right', 'dash', 'tag'].forEach(action => {
      const keyName = userKeybinds[action];
      this.add.text(620, y, `${action.toUpperCase()}: ${keyName.replace('Key', '')}`, {
        fontFamily: 'Inter',
        fontSize: '11px',
        fill: '#cbd5e1'
      });
      y += 22;
    });
  }
}

// --- MAIN GAMEPLAY SCENE ---
class GameScene extends Phaser.Scene {
  constructor() {
    super('GameScene');
  }

  init(data) {
    this.p1Class = data.p1Class || 'STRIKER';
    this.isVSBot = data.isVSBot || false;
    this.botLevel = data.botLevel || 'MEDIUM';
    this.matchTimer = 45;
  }

  create() {
    this.add.rectangle(400, 300, 800, 600, 0x020617);
    this.add.grid(400, 300, 800, 600, 40, 40, 0x0f172a, 0.5, 0x1e293b, 0.8);

    // Map Boundaries & Walls
    this.obstacles = this.physics.add.staticGroup();
    this.createArenaWalls();

    // Keybind Mapping
    this.keys = {
      up: this.input.keyboard.addKey(userKeybinds.up),
      left: this.input.keyboard.addKey(userKeybinds.left),
      down: this.input.keyboard.addKey(userKeybinds.down),
      right: this.input.keyboard.addKey(userKeybinds.right),
      dash: this.input.keyboard.addKey(userKeybinds.dash),
      tag: this.input.keyboard.addKey(userKeybinds.tag)
    };

    const isHost = this.isVSBot ? true : net.isHost;

    // Spawn Players
    this.localPlayer = new Player(this, isHost ? 150 : 650, 300, this.p1Class, isHost);
    this.physics.add.collider(this.localPlayer, this.obstacles);

    if (this.isVSBot) {
      this.remotePlayer = new SmartBot(this, 650, 300, 'STRIKER', false, this.botLevel, this.obstacles);
      this.physics.add.collider(this.remotePlayer, this.obstacles);
    } else {
      this.remotePlayer = new Player(this, isHost ? 650 : 150, 300, 'STRIKER', !isHost);
      this.physics.add.collider(this.remotePlayer, this.obstacles);
      net.conn.on('data', (data) => this.handleNetworkData(data));
    }

    // Direct Physical Overlap Collision for Tagging
    this.physics.add.collider(this.localPlayer, this.remotePlayer);

    // Timer HUD
    this.timerText = this.add.text(400, 35, `${this.matchTimer}`, {
      fontFamily: 'Orbitron',
      fontSize: '28px',
      fontStyle: '900',
      fill: '#ffffff'
    }).setOrigin(0.5);

    if (isHost) {
      this.time.addEvent({
        delay: 1000,
        callback: () => {
          this.matchTimer--;
          this.timerText.setText(`${this.matchTimer}`);
          if (!this.isVSBot) net.send({ type: 'TIMER', value: this.matchTimer });
          if (this.matchTimer <= 0) this.endMatch();
        },
        loop: true
      });
    }
  }

  createArenaWalls() {
    const wallSpecs = [
      { x: 400, y: 180, w: 140, h: 28 },
      { x: 400, y: 420, w: 140, h: 28 },
      { x: 200, y: 300, w: 28, h: 160 },
      { x: 600, y: 300, w: 28, h: 160 }
    ];

    wallSpecs.forEach(spec => {
      const rect = this.add.rectangle(spec.x, spec.y, spec.w, spec.h, 0x1e293b);
      rect.setStrokeStyle(2, 0x38bdf8);
      this.obstacles.add(rect);
    });
  }

  checkTagLogic() {
    // Check tagging every single frame for both local player and AI bot
    if (this.localPlayer.isIt && this.localPlayer.canTag) {
      if (this.localPlayer.attemptTag(this.remotePlayer)) {
        this.cameras.main.shake(120, 0.01);
        if (!this.isVSBot) net.send({ type: 'TAG_SUCCESS' });
      }
    } else if (this.remotePlayer.isIt && this.remotePlayer.canTag) {
      if (this.remotePlayer.attemptTag(this.localPlayer)) {
        this.cameras.main.shake(120, 0.01);
      }
    }
  }

  update() {
    let vx = 0;
    let vy = 0;

    if (this.keys.up.isDown) vy -= 1;
    if (this.keys.down.isDown) vy += 1;
    if (this.keys.left.isDown) vx -= 1;
    if (this.keys.right.isDown) vx += 1;

    const moveVec = new Phaser.Math.Vector2(vx, vy).normalize();

    if (!this.localPlayer.isDashing) {
      this.localPlayer.body.setVelocity(moveVec.x * this.localPlayer.stats.speed, moveVec.y * this.localPlayer.stats.speed);
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.dash) && (vx !== 0 || vy !== 0)) {
      this.localPlayer.dash(moveVec);
    }

    // Run distance tag check every frame
    this.checkTagLogic();

    this.localPlayer.renderAura();

    if (this.isVSBot) {
      this.remotePlayer.updateAI(this.localPlayer);
    } else {
      this.remotePlayer.renderAura();
      net.send({
        type: 'SYNC',
        x: this.localPlayer.x,
        y: this.localPlayer.y,
        vx: this.localPlayer.body.velocity.x,
        vy: this.localPlayer.body.velocity.y,
        isDashing: this.localPlayer.isDashing,
        isIt: this.localPlayer.isIt
      });
    }
  }

  handleNetworkData(data) {
    if (data.type === 'SYNC') {
      this.remotePlayer.setPosition(data.x, data.y);
      this.remotePlayer.body.setVelocity(data.vx, data.vy);
      this.remotePlayer.isDashing = data.isDashing;
      this.remotePlayer.setItState(data.isIt);
      this.localPlayer.setItState(!data.isIt);
    } else if (data.type === 'TAG_SUCCESS') {
      this.cameras.main.shake(120, 0.01);
      this.localPlayer.setItState(true);
      this.remotePlayer.setItState(false);
    } else if (data.type === 'TIMER') {
      this.matchTimer = data.value;
      this.timerText.setText(`${this.matchTimer}`);
      if (this.matchTimer <= 0) this.endMatch();
    }
  }

  endMatch() {
    const localWon = !this.localPlayer.isIt;
    const coins = localWon ? 120 : 30;
    const xp = localWon ? 150 : 50;

    account.addRewards(localWon, coins, xp);

    this.add.text(400, 260, localWon ? 'VICTORY' : 'DEFEAT', {
      fontFamily: 'Orbitron',
      fontSize: '42px',
      fontStyle: '900',
      fill: localWon ? '#22c55e' : '#ef4444'
    }).setOrigin(0.5);

    this.add.text(400, 320, `+🪙${coins} Coins   +${xp} XP`, {
      fontFamily: 'Orbitron',
      fontSize: '18px',
      fill: '#facc15'
    }).setOrigin(0.5);

    this.time.delayedCall(2500, () => {
      this.scene.start('MenuScene');
    });
  }
}

// --- GAME INITIALIZATION ---
const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  parent: 'game-container',
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 0 }, debug: false }
  },
  scene: [MenuScene, GameScene]
};

const game = new Phaser.Game(config);
</script>
